name: Build ImmersiveThunder - All Versions

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build for Minecraft ${{ matrix.mc_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: [1.20.1, 1.19.2, 1.18.2]
        include:
          - mc_version: 1.20.1
            forge_version: 47.3.0
            parchment_version: 2023.09.03
            java_version: 17
          - mc_version: 1.19.2
            forge_version: 43.5.0
            parchment_version: 2022.08.14
            java_version: 17
          - mc_version: 1.18.2
            forge_version: 40.3.0
            parchment_version: 2022.08.07
            java_version: 17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure version-specific properties
        run: |
          echo "Configuring build for Minecraft ${{ matrix.mc_version }}"
          # Copy the version-specific properties over gradle.properties
          cp "gradle-mc${{ matrix.mc_version }}.properties" gradle.properties
          echo "Using properties:"
          cat gradle.properties

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List built files
        run: |
          echo "Build output for Minecraft ${{ matrix.mc_version }}:"
          ls -lh build/libs/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveThunder-Forge-${{ matrix.mc_version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1.20.1 | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| 1.19.2 | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| 1.18.2 | ✅ Success |" >> $GITHUB_STEP_SUMMARY
